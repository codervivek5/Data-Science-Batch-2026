name: Update Course Progress

on:
  push:
    paths:
      - README.md

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Calculate progress
        run: |
          TOTAL=$(grep -o "\- \[ \]" README.md | wc -l)
          DONE=$(grep -o "\- \[x\]" README.md | wc -l)

          if [ "$TOTAL" -eq 0 ]; then
            PERCENT=0
          else
            PERCENT=$((DONE * 100 / (DONE + TOTAL)))
          fi

          echo "Progress: $PERCENT%"

          sed -i "s/Course_Progress-[0-9]*%/Course_Progress-$PERCENT%/g" README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git commit -am "🔄 Auto-update course progress"
          git push
